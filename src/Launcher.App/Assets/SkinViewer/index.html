<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>玩家皮肤</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;user-select:none}
    canvas{display:block;width:100%;height:100%;position:relative;z-index:1;touch-action:none;cursor:grab;outline:none}
    canvas:active{cursor:grabbing}
    .shadow{position:absolute;bottom:20px;left:50%;width:112px;height:20px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(47,64,91,.16),transparent 70%);pointer-events:none}
    html.dark .shadow{background:radial-gradient(ellipse,rgba(0,0,0,.42),transparent 70%)}
    #error{display:none;position:absolute;inset:auto 12px 8px;text-align:center;font:12px 'Segoe UI',sans-serif;color:#7a8494}
  </style>
  <script defer src="skinview3d.bundle.js"></script>
  <script defer src="viewer.js"></script>
</head>
<body><div class="shadow"></div><canvas id="player" aria-label="玩家皮肤模型，可拖动旋转" tabindex="0"></canvas><div id="error"></div></body>
</html>
