<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>玩家皮肤</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;border-radius:6px;background:transparent;user-select:none}
    body::before,body::after{content:"";position:absolute;inset:0;pointer-events:none}
    body::before{background:url('minecraft-clearing.png') center 70%/cover no-repeat;filter:saturate(.78) brightness(1.04);opacity:.88}
    body::after{background:radial-gradient(ellipse at 50% 42%,rgba(242,248,255,.12),transparent 65%),linear-gradient(180deg,rgba(244,249,255,.08),transparent 50%,rgba(30,49,35,.12));box-shadow:inset 0 0 24px rgba(19,41,27,.1)}
    html.dark body::before{filter:saturate(.65) brightness(.68);opacity:.92}
    html.dark body::after{background:linear-gradient(180deg,rgba(15,25,44,.12),transparent 50%,rgba(10,18,22,.25))}
    html.high-contrast body::before,html.high-contrast body::after{display:none}
    canvas{display:block;width:100%;height:100%;position:relative;z-index:2;touch-action:none;cursor:grab;outline:none}
    canvas:active{cursor:grabbing}
    canvas:focus-visible{outline:2px solid #1974e9;outline-offset:-3px}
    .shadow{position:absolute;bottom:7%;left:50%;z-index:1;width:46%;height:18px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(20,35,21,.35),transparent 70%);pointer-events:none}
    html.dark .shadow{background:radial-gradient(ellipse,rgba(0,0,0,.52),transparent 70%)}
    html.high-contrast .shadow{display:none}
    #error{display:none;position:absolute;inset:auto 12px 8px;text-align:center;font:12px 'Segoe UI',sans-serif;color:#7a8494}
  </style>
  <script defer src="skinview3d.bundle.js"></script>
  <script defer src="viewer.js"></script>
</head>
<body><div class="shadow"></div><canvas id="player" aria-label="玩家皮肤模型，可拖动旋转" tabindex="0"></canvas><div id="error"></div></body>
</html>
